<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sqb Phone Verification</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-screen="phone">
    <main class="page">
      <section class="card auth-card sqb-card">


        <header class="auth-header sqb-header">
          <div class="auth-logo sqb-logo" aria-label="Sqb logo">
            <img class="auth-logo-image" src="./img/logo.svg" alt="Sqb logo" />
          </div>
          <h1 class="sqb-title">Iltimos telefon raqamini kiriting</h1>
        </header>

        <form class="phone-form auth-form sqb-form" id="phoneForm">
          <label class="sqb-label visually-label" for="phone">Telefon raqam</label>
          <div class="phone-field sqb-phone-field">
            <input
              id="phone"
              name="phone"
              type="tel"
              inputmode="numeric"
              autocomplete="tel"
              placeholder="+998 (__) ___ __ __"
              required
            />
          </div>
          <p class="field-error" id="phoneError"></p>

          <button class="submit-btn is-inactive sqb-submit" type="submit" disabled>Kirish</button>
          <p class="status" id="statusMessage" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
