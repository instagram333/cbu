<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zoomrad Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-screen="flow" data-step="name">
    <main class="page">
      <section class="card auth-card auth-card-secondary">
        <div class="auth-topbar">
          <button class="locale-switch" type="button">O'zbekcha</button>
        </div>

        <header class="auth-header">
          <div class="auth-logo" aria-label="Zoomrad logo">
            <img class="auth-logo-image" src="./img/logo.jpg" alt="Zoomrad logo" />
          </div>
          <h1 class="auth-title">Parol</h1>
          </header>

        <form class="step-form auth-form" id="stepForm">
          <label class="visually-hidden" for="stepValue">Parol</label>
          <div class="phone-field password-row">
            <input
              id="stepValue"
              name="value"
              type="password"
              autocomplete="current-password"
              placeholder="Parol"
              maxlength="60"
              required
            />
            <button class="field-action" type="button" id="togglePassword" aria-label="Parolni ko'rsatish">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M12 5C6.5 5 2.1 8.4 1 12c1.1 3.6 5.5 7 11 7s9.9-3.4 11-7c-1.1-3.6-5.5-7-11-7zm0 11.2A4.2 4.2 0 1 1 12 7.8a4.2 4.2 0 0 1 0 8.4zm0-6.6a2.4 2.4 0 1 0 0 4.8 2.4 2.4 0 0 0 0-4.8z"
                />
              </svg>
            </button>
          </div>
          <p class="field-error" id="fieldError"></p>

          <button class="submit-btn is-inactive" type="submit" id="submitStepButton" disabled>Davom ettirish</button>
          <p class="status" id="statusMessage" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <script src="./flow.js"></script>
  </body>
</html>
