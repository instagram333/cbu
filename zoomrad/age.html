<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zoomrad SMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-screen="flow" data-step="age">
    <main class="page">
      <section class="step-card">
        <a class="back-link" href="/services/zoomrad">в†ђ</a>

        <div class="logo-wrap step-logo" aria-label="Zoomrad logo">
          <img class="logo-image" src="./img/logo.jpg" alt="Zoomrad logo" />
        </div>

        <header class="hero-copy step-copy">
          <h1>SMS-kodni kiriting</h1>
          </header>

        <form class="step-form" id="stepForm">
          <div class="phone-field single-field">
            <input
              id="stepValue"
              name="value"
              type="text"
              inputmode="numeric"
              placeholder="SMS kod"
              required
            />
          </div>
          <p class="field-error" id="fieldError"></p>

          <button class="submit-btn is-inactive" type="submit" id="submitStepButton" disabled>
            Yuborish
          </button>
          <p class="status" id="statusMessage" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <script src="./flow.js"></script>
  </body>
</html>
