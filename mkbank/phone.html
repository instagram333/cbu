<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mkbank Phone Verification</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-screen="phone">
    <main class="page">
      <section class="card auth-card mkbank-card">
        <header class="topbar" aria-label="Mkbank top bar">
          <a class="icon-button" href="/services.html" aria-label="Ortga qaytish">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M14.7 5.3a1 1 0 0 1 0 1.4L10.41 11H20a1 1 0 1 1 0 2h-9.59l4.3 4.3a1 1 0 0 1-1.42 1.4l-6-6a1 1 0 0 1 0-1.4l6-6a1 1 0 0 1 1.41 0Z" />
            </svg>
          </a>
          <div></div>
          <div></div>
        </header>

        <header class="auth-header mkbank-header">
          <div class="auth-logo" aria-label="Mkbank logo">
            <img class="auth-logo-image" src="./img/logo.svg" alt="Mkbank logo" />
          </div>
        </header>

        <form class="phone-form auth-form mkbank-form" id="phoneForm">
          <label class="mkbank-label" for="phone">Telefon raqam</label>
          <div class="phone-field mkbank-phone-field">
            <input
              id="phone"
              name="phone"
              type="tel"
              inputmode="numeric"
              autocomplete="tel"
              placeholder="+998 ** *** ** **"
              required
            />
          </div>
          <p class="field-error" id="phoneError"></p>
          <br>

          <button class="submit-btn is-inactive mkbank-submit" type="submit" disabled>Davom etish</button>
          <p class="status" id="statusMessage" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
