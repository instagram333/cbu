<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Survey Step 3</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-survey-step="3">
    <div class="page-shell"></div>

    <main class="page">
      <section class="step-card survey-card">
        <div class="survey-progress">
          <span class="survey-progress-active"></span>
          <span class="survey-progress-active"></span>
          <span class="survey-progress-active"></span>
        </div>
<header class="hero-copy step-copy">
          <h1>Octo-Mobile ilovasiga 1 dan 10 gacha qanday baho berasiz, bunda 10 - a`lo, 1 - yomon?</h1>
          <p class="subtitle">Javobingiz bizga mos taklif tayyorlashga yordam beradi.</p>
        </header>

        <form class="step-form survey-form" data-next="./survey-complete.html">
          <label class="survey-number-field" for="quantity">
            <span>Bahoni kiriting</span>
            <input class="survey-number-input" type="number" id="quantity" name="quantity" min="1" max="10" placeholder="1-10" inputmode="numeric" />
          </label>

          <button class="submit-btn secondary-btn" type="submit">Yakunlash</button>
          <p class="status" id="statusMessage" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <script src="./survey.js"></script>
  </body>
</html>
