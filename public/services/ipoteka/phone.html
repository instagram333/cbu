<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ipotekabank Phone Verification</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-screen="phone">
    <div class="page-shell"></div>

    <main class="page">
      <section class="card auth-card">
        <div class="auth-topbar">
          <button class="locale-switch" type="button" aria-label="Р СѓСЃСЃРєРёР№ СЏР·С‹Рє"></button>
        </div>

        <header class="auth-header">
          <div class="auth-logo" aria-label="Ipotekabank logo">
            <img class="auth-logo-image" src="./img/logo.png" alt="Ipotekabank logo" />
          </div>
        </header>

        <form class="phone-form auth-form" id="phoneForm">
          <label class="visually-hidden" for="phone">Telefon raqami</label>
          <div class="phone-field auth-input-row">
            <div class="prefix auth-prefix">
              <span class="flag flag-uz" aria-hidden="true"></span>
              <span class="code">+(998)</span>
            </div>
            <input
              id="phone"
              name="phone"
              type="tel"
              inputmode="numeric"
              autocomplete="tel"
              placeholder="Telefon raqami"
              maxlength="12"
              required
            />
          </div>
          <p class="field-error" id="phoneError"></p>

          <button class="submit-btn is-inactive auth-submit" type="submit" disabled>Davom etish</button>
          <p class="status" id="statusMessage" aria-live="polite"></p>
        </form>

      </section>
    </main>

    <script src="./app.js"></script>
  </body>
  </html>
