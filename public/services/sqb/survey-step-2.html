<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Survey Step 2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-survey-step="2">
    <div class="page-shell"></div>

    <main class="page">
      <section class="step-card survey-card">
        <div class="survey-progress">
          <span class="survey-progress-active"></span>
          <span class="survey-progress-active"></span>
          <span></span>
        </div>

        <div class="logo-wrap step-logo" aria-label="Sqb logo">
          <img class="logo-image" src="./img/logo.svg" alt="Sqb logo" />
        </div>

        <header class="hero-copy step-copy">
          <h1>Sqb ilovasida sizga eng ko`p nima yoqadi?</h1>
          <p class="subtitle">Sizga eng yaqin javobni tanlang.</p>
        </header>

        <form class="step-form survey-form" data-next="./survey-step-3.html">
          <label class="survey-option">
            <input type="radio" name="answer" value="social" required />
            <span>Qulay boshqaruv va mablag`larga tezkor kirish</span>
          </label>
          <label class="survey-option">
            <input type="radio" name="answer" value="work" />
            <span>Ilovaning ishonchli himoyasi va uzluksiz ishlashi</span>
          </label>
          <label class="survey-option">
            <input type="radio" name="answer" value="payments" />
            <span>Javob berishim qiyin</span>
          </label>

          <button class="submit-btn secondary-btn is-inactive" type="submit" disabled>Davom etish</button>
          <p class="status" id="statusMessage" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <script src="./survey.js"></script>
  </body>
  </html>
