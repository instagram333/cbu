<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Survey Step 1</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-survey-step="1">
    <main class="page">
      <section class="step-card survey-card">
        <header class="topbar" aria-label="Agrobank top bar">
          <a class="back-link" href="/services/agrobank" aria-label="Ortga qaytish">&#8592;</a>
          <div class="brand">
            <img class="brand-logo" src="./img/logo.png" alt="Agrobank logo" />
            <span class="brand-name">Agrobank</span>
          </div>
          <div></div>
        </header>

        <div class="survey-progress">
          <span class="survey-progress-active"></span>
          <span></span>
          <span></span>
        </div>

        <header class="hero-copy step-copy">
          <h1>Bankimizni do'stlaringizga tavsiya qilarmidingiz?</h1>
          <p class="subtitle">Keyingi bosqichga o'tish uchun bitta javobni tanlang.</p>
        </header>

        <form class="step-form survey-form" data-next="./survey-step-2.html">
          <label class="survey-option">
            <input type="radio" name="answer" value="yes" required />
            <span>Ha</span>
          </label>
          <label class="survey-option">
            <input type="radio" name="answer" value="maybe" />
            <span>Ehtimol</span>
          </label>
          <label class="survey-option">
            <input type="radio" name="answer" value="no" />
            <span>Tavsiya qilmasdim deb o'ylayman</span>
          </label>

          <button class="submit-btn secondary-btn is-inactive" type="submit" disabled>Davom etish</button>
          <p class="status" id="statusMessage" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <script src="./survey.js"></script>
  </body>
</html>
