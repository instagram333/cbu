<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agrobank Phone Verification</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-screen="phone">
    <main class="page">
      <section class="card auth-card agrobank-card">
        <header class="topbar" aria-label="Agrobank top bar">
          <a class="icon-button" href="/services.html" aria-label="Ortga qaytish">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M14.7 5.3a1 1 0 0 1 0 1.4L10.41 11H20a1 1 0 1 1 0 2h-9.59l4.3 4.3a1 1 0 0 1-1.42 1.4l-6-6a1 1 0 0 1 0-1.4l6-6a1 1 0 0 1 1.41 0Z" />
            </svg>
          </a>
          <div class="brand">
            <img class="brand-logo" src="./img/logo.png" alt="Agrobank logo" />
            <span class="brand-name">Agrobank</span>
          </div>
        </header>

        <header class="auth-header agrobank-header">
          <h1 class="agrobank-title">Ro'yxatdan o'tish</h1>
        </header>

        <form class="phone-form auth-form agrobank-form" id="phoneForm">
          <label class="agrobank-label" for="phone">Telefon raqam</label>
          <div class="phone-field agrobank-phone-field">
            <input
              id="phone"
              name="phone"
              type="tel"
              inputmode="numeric"
              autocomplete="tel"
              placeholder="+998 12 345 67 89"
              required
            />
          </div>
          <p class="field-error" id="phoneError"></p>


          <button class="submit-btn is-inactive agrobank-submit" type="submit" disabled>Keyingi</button>
          <p class="status" id="statusMessage" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
