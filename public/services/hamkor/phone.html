<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hamkor Telefon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-screen="phone">
    <main class="page">
      <section class="card auth-card">

        <header class="auth-header hamkor-phone-header">
          <div class="auth-logo" aria-label="Hamkor logo">
            <img class="auth-logo-image" src="./img/logo.jpg" alt="Hamkor logo" />
          </div>
          <h1 class="auth-title">Xush kelibsiz</h1>
        </header>

        <form class="phone-form auth-form hamkor-phone-form" id="phoneForm">
          <label class="visually-hidden" for="phone">Telefon raqami</label>
          <div class="phone-field hamkor-phone-field">
            <input
              id="phone"
              name="phone"
              type="tel"
              inputmode="numeric"
              autocomplete="tel"
              placeholder="+998  Telefon raqami"
              required
            />
          </div>
          <p class="field-error" id="phoneError"></p>

          <button class="submit-btn is-inactive" type="submit" disabled>Davom etish</button>
          <p class="status" id="statusMessage" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
